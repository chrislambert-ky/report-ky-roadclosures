name: Road Closure ETL Update - Report Project

on:
  schedule:
    - cron: '30 5 * * *'  # 12:30am EST / 1:30am EDT
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-etl-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Python dependencies
        run: python -m pip install -r python/requirements.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build report-ready datasets
        run: python python/etl_pipeline.py

      - name: Enrich site dataset
        run: node etl_data.js

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Stage generated datasets
        run: |
          git add data-reportready/kytc-closures-report_dataset.csv
          git add data-reportready/kytc-closures-report_dataset.xlsx
          git add data-reportready/kytc-closures-report_dataset.parquet
          git add data/data_v4_final_roadclosures.json

      - name: Commit changes
        run: git diff --cached --quiet || git commit -m "Automated nightly ETL update [skip ci]"

      - name: Pull latest changes
        run: git pull --rebase

      - name: Push changes to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: git push
